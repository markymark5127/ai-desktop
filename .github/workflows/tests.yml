name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python source (including GNOME UI)
        run: python -m compileall -q src scripts tests
      - name: Run headless smoke test
        run: PYTHONPATH=src python -m aidesktop --ask "system info"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
