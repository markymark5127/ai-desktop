[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop"
version = "0.1.0"
description = "An experimental GNOME desktop assistant for approachable Linux troubleshooting"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-desktop = "aidesktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
